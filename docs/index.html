<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity Copilot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate">
  <form id="gate-form">
    <label for="gate-secret">Dashboard password</label>
    <input type="password" id="gate-secret" autocomplete="off" required>
    <button type="submit">Unlock</button>
    <p id="gate-error" class="error hidden">Wrong password or can't reach the endpoint.</p>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Productivity Copilot</h1>
    <button id="refresh-btn" title="Refresh now">↻</button>
  </header>

  <div id="banner-area"></div>

  <main>
    <section id="pending-plan-section">
      <h2>Today's Plan (pending)</h2>
      <p class="muted">Not built yet — Stage 2/3 next step.</p>
    </section>

    <section id="status-section">
      <h2>Status</h2>
      <div id="status-groups"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
