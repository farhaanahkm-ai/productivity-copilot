<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity Copilot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate">
  <form id="gate-form">
    <label for="gate-secret">Dashboard password</label>
    <input type="password" id="gate-secret" autocomplete="off" required>
    <button type="submit">Unlock</button>
    <p id="gate-error" class="error hidden">Wrong password or can't reach the endpoint.</p>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Productivity Copilot</h1>
    <button id="refresh-btn" title="Refresh now">↻</button>
  </header>

  <div id="banner-area"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-block">
        <h2>Life Areas</h2>
        <div id="area-filters" class="filter-list"></div>
      </div>

      <div class="sidebar-block">
        <h2>At a Glance</h2>
        <div id="glance-stats" class="glance-stats"></div>
      </div>
    </aside>

    <main class="main-col">
      <section id="pending-plan-section" class="panel">
        <div class="panel-header">
          <h2>Today's Plan <span class="muted">(pending)</span></h2>
        </div>
        <p class="muted hint">Drag any item from Status below to add it here.</p>
        <div id="pending-plan-rows" class="dropzone"></div>
      </section>

      <section id="status-section" class="panel">
        <div class="panel-header">
          <h2>Status</h2>
        </div>
        <button id="add-block-btn" type="button">+ Add block</button>
        <div id="status-groups"></div>
      </section>

      <section id="timeline-section" class="panel">
        <div class="panel-header">
          <h2>Timeline</h2>
          <span class="muted">by due date, grouped by project</span>
        </div>
        <div id="timeline-rows"></div>
      </section>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
